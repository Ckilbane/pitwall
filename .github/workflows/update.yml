name: Update data

# Fetch changed TBA data, recompute ratings, publish the static site to GitHub Pages.
# Design: docs/SPEC.md section 2.  The TBA key (repository secret TBA_KEY) is exposed to the fetch
# step only.  Third-party actions: none.  Official actions are pinned to major versions (full commit
# SHAs could not be verified offline).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = daily; live = active events only; daily = current season; full = every season"
        type: choice
        options: [auto, live, daily, full]
        default: auto
      seasons:
        description: "Seasons to fetch (and, with force, to rebuild), e.g. 2025 2026. Empty = by mode."
        type: string
        default: ""
      force_recompute:
        description: "Rebuild the listed seasons (all if none listed) even if nothing changed"
        type: boolean
        default: false
      deploy:
        description: "Deploy to Pages after building"
        type: boolean
        default: true
  schedule:
    - cron: "7,37 * * 2-5 0,4,5,6"   # every 30 min Thu-Sun (UTC), Feb-May -> live
    - cron: "7,37 0-6 * 2-5 1"       # Mon 00:00-06:59 UTC = Sunday evening in US time zones -> live
    - cron: "23 9 * * *"             # daily -> daily (Mondays UTC: full)

# Every job states its own permissions.
permissions: {}

# Runs queue; a run is never cancelled half way (GitHub keeps one pending run per group).
concurrency:
  group: pitwall-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # push the `data` cache branch
      pages: write      # actions/configure-pages
    outputs:
      deploy: ${{ steps.final.outputs.deploy }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe the data branch
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if out="$(gh api "repos/${GITHUB_REPOSITORY}/branches/data" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No data branch yet: starting with an empty cache."
          else
            echo "::error::Could not tell whether the data branch exists; refusing to continue (it would be recreated from scratch)."
            echo "$out" | head -5
            exit 1
          fi

      - name: Check out the data branch (cache)
        if: steps.probe.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: cache
          fetch-depth: 1

      - name: Start an empty cache
        if: steps.probe.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q cache
          git -C cache remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -C cache config --local "http.${GITHUB_SERVER_URL}/.extraheader" "AUTHORIZATION: basic ${auth}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Learn the Pages base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch the live manifest
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          rm -f live_manifest.json
          if ! curl -fsS --retry 2 --max-time 30 "${BASE_URL%/}/data/manifest.json" -o live_manifest.json; then
            echo "No live manifest (first deploy, or the site is down)."
            rm -f live_manifest.json
          fi

      - name: Resolve run settings
        id: cfg
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SEASONS: ${{ inputs.seasons }}
          DATA_EXISTS: ${{ steps.probe.outputs.exists }}
          INPUT_FORCE: ${{ format('{0}', inputs.force_recompute) }}
          INPUT_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.deploy) || 'true' }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              mode="${INPUT_MODE:-auto}"
              if [ "$mode" = "auto" ]; then mode="daily"; fi ;;
            schedule)
              case "$SCHEDULE" in
                "7,37 * * 2-5 0,4,5,6"|"7,37 0-6 * 2-5 1") mode="live" ;;
                *) if [ "$(date -u +%u)" = "1" ]; then mode="full"; else mode="daily"; fi ;;
              esac ;;
            *) echo "::error::unexpected event $EVENT_NAME"; exit 1 ;;
          esac
          # first run (no data branch yet): build every season, whatever the trigger asked
          if [ "$DATA_EXISTS" != "true" ]; then mode="full"; fi
          seasons="$(tr ',' ' ' <<<"$INPUT_SEASONS" | xargs)"
          if [ -n "$seasons" ] && ! [[ "$seasons" =~ ^[0-9]{4}( [0-9]{4})*$ ]]; then
            echo "::error::seasons must be four-digit years separated by spaces"; exit 1
          fi
          force=false; if [ "$INPUT_FORCE" = "true" ]; then force=true; fi
          deploy=true; if [ "$INPUT_DEPLOY" = "false" ]; then deploy=false; fi
          {
            echo "mode=$mode"
            echo "seasons=$seasons"
            echo "force=$force"
            echo "deploy_input=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode seasons='${seasons}' force=$force deploy=$deploy"

      - name: Fetch changed data from TBA
        id: fetch
        env:
          TBA_KEY: ${{ secrets.TBA_KEY }}
          MODE: ${{ steps.cfg.outputs.mode }}
          SEASONS: ${{ steps.cfg.outputs.seasons }}
        run: |
          args=(--cache cache/raw --config pipeline/config.json --mode "$MODE" --report fetch_report.json)
          if [ -n "$SEASONS" ]; then args+=(--seasons $SEASONS); fi
          python pipeline/fetch/tba_fetch.py "${args[@]}"

      - name: Plan
        id: plan
        env:
          FORCE: ${{ steps.cfg.outputs.force }}
          SEASONS: ${{ steps.cfg.outputs.seasons }}
        run: |
          args=(plan --cache cache --config pipeline/config.json --fetch-report fetch_report.json --out plan.json)
          if [ -f live_manifest.json ]; then args+=(--live-manifest live_manifest.json); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$SEASONS" ]; then args+=(--seasons $SEASONS); fi
          python pipeline/build.py "${args[@]}"

      - name: Build and validate
        id: build
        if: steps.plan.outputs.has_work == 'true'
        run: python pipeline/build.py run --plan plan.json --cache cache --work work --out-data staged_data

      - name: Stage the site
        if: steps.build.outputs.deploy_ok == 'true'
        run: python pipeline/tools/stage_site.py --site site --data staged_data --out _site

      - name: Upload the Pages artifact
        id: upload
        if: steps.build.outputs.deploy_ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Save the cache to the data branch
        id: save
        # also after an aborted plan: the bodies fetched so far are valid cache content
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' && (steps.plan.outputs.has_work == 'true' || steps.plan.outputs.abort == 'true') }}
        env:
          DEPLOY_OK: ${{ steps.build.outputs.deploy_ok }}
          DATA_VERSION: ${{ steps.build.outputs.data_version }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_OK" = "true" ]; then
            python pipeline/build.py finalize --cache cache --staged staged_data --run-result work/run_result.json
          fi
          cd cache
          git config user.name "pitwall-bot"
          git config user.email "pitwall-bot@users.noreply.github.com"
          # a one-commit cache, not history: start a new root commit and force-push it
          git symbolic-ref HEAD refs/heads/next
          git add -A
          git commit -q -m "data ${DATA_VERSION:-cache}"
          git push -f origin HEAD:data

      - name: Decide whether to deploy
        id: final
        if: ${{ !cancelled() }}
        env:
          PLAN_DEPLOY: ${{ steps.plan.outputs.plan_deploy }}
          DEPLOY_OK: ${{ steps.build.outputs.deploy_ok }}
          UPLOAD: ${{ steps.upload.outcome }}
          DEPLOY_INPUT: ${{ steps.cfg.outputs.deploy_input }}
        run: |
          deploy=false
          if [ "$PLAN_DEPLOY" = "true" ] && [ "$DEPLOY_OK" = "true" ] && [ "$UPLOAD" = "success" ] && [ "$DEPLOY_INPUT" = "true" ]; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"

      - name: Report problems (fails the job after the deploy decision)
        if: ${{ !cancelled() }}
        env:
          ABORT: ${{ steps.plan.outputs.abort }}
          ABORT_REASON: ${{ steps.plan.outputs.abort_reason }}
          FAILED: ${{ steps.build.outputs.failed_seasons }}
        run: |
          if [ "$ABORT" = "true" ]; then
            echo "::error::Update skipped: ${ABORT_REASON}. The live site still serves the last good data."
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Season(s) ${FAILED} failed to build or validate; the site serves their last good data and says so. See the Build step."
            exit 1
          fi

  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
