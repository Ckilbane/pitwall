<!-- Fonts: Barlow, Barlow Condensed, JetBrains Mono, Source Serif 4 (all OFL). The spec calls for self-hosted
     woff2 files in assets/fonts/; none were available when this shell was built, so this loads them from Google
     Fonts with system fallbacks (see tokens.css). css/fonts.css holds the local @font-face rules (files named
     assets/fonts/<Family>-<weight>[italic].woff2); once those files exist, link it here and drop the three Google links. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
